name: Build DUMA SNAP APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Prepare original DUMA launcher icon
        run: |
          python -m pip install --quiet Pillow
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          curl -L --fail "https://raw.githubusercontent.com/doctorzuza22-pixel/DUMA-Browser/main/app/src/main/assets/duma_logo.jpg" -o /tmp/duma_logo.jpg
          python - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/duma_logo.jpg').convert('RGB')
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density,size in sizes.items():
              im.resize((size,size),Image.Resampling.LANCZOS).save(f'app/src/main/res/mipmap-{density}/ic_launcher.png')
          PY
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload DUMA SNAP APK
        uses: actions/upload-artifact@v4
        with:
          name: DUMA-SNAP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
