name: Build AI SNAP APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip app and gradle if zipped
        run: |
          if [ -f app.zip ]; then unzip -o app.zip -d . || true; rm app.zip || true; fi
          if [ -f gradle.zip ]; then unzip -o gradle.zip -d . || true; rm gradle.zip || true; fi
      - name: Create full AI SNAP project
        run: |
          mkdir -p app/src/main/java/com/aisnap/camera/pro
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AI SNAP"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.3.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { namespace 'com.aisnap.camera.pro'; compileSdk 35
            defaultConfig { applicationId "com.aisnap.camera.pro"; minSdk 24; targetSdk 35; versionCode 1; versionName "1.0" }
            buildTypes { release { minifyEnabled false }; debug { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
            kotlinOptions { jvmTarget = '1.8' } }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.camera:camera-core:1.3.4'
            implementation 'androidx.camera:camera-camera2:1.3.4'
            implementation 'androidx.camera:camera-lifecycle:1.3.4'
            implementation 'androidx.camera:camera-view:1.3.4'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
          }
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources><style name="Theme.AISNAP" parent="Theme.Material3.DayNight.NoActionBar"><item name="colorPrimary">#000000</item></style></resources>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">AI SNAP</string></resources>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
